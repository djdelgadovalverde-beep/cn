# Publica web/ en Cloudflare Pages (gratis, sin créditos de Netlify) cada vez que se sube a «main».
# Requiere dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (token con permiso «Cloudflare Pages: Edit»)
#   CLOUDFLARE_ACCOUNT_ID (2f2b9bf5541884fa45d4f3872fe5eee1)
name: Publicar en Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
concurrency: { group: cloudflare-pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis
        run: node tests/check-syntax.js
      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=cn-desempeno --branch=main
