# Publicación gratuita en GitHub Pages cada vez que se sube a «main» (carpeta web/).
# Requiere (una sola vez): repositorio público + Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis
        run: node tests/check-syntax.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
